<div class="lobby-container">
  <div class="lobby-card">
    <h1 class="lobby-title">Retrospective Board</h1>
    <p class="lobby-subtitle">Enter your username to join the board</p>
    
    <form (ngSubmit)="onJoinBoard()" class="lobby-form">
      <div class="form-group">
        <input
          type="text"
          class="username-input"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username..."
          [maxlength]="maxUsernameLength"
          autofocus
        />
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      </div>
      
      <div class="form-group">
        <label class="checkbox-label">
          <input 
            type="checkbox" 
            [(ngModel)]="isAdmin" 
            name="isAdmin"
          />
          <span class="checkbox-text">Join as Admin</span>
        </label>
        <p class="admin-info">Admins can start/stop retro and view creator and voter details</p>
      </div>
      
      <button type="submit" class="join-btn">Join Board</button>
    </form>
  </div>
</div>
