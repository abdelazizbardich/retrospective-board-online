<div class="column">
  <div class="column-header">
    <h3 class="column-title">{{ column.name }}</h3>
    <button class="delete-column-btn" (click)="onDeleteColumn()">×</button>
  </div>

  <div 
    class="tickets-container"
    cdkDropList
    [id]="column.id"
    [cdkDropListData]="column.tickets"
    [cdkDropListConnectedTo]="[]"
    (cdkDropListDropped)="drop($event)">
    
    <div 
      *ngFor="let ticket of column.tickets"
      cdkDrag>
      <app-ticket
        [ticket]="ticket"
        [userId]="userId"
        (voteTicket)="onVoteTicket($event)"
        (unvoteTicket)="onUnvoteTicket($event)"
        (updateStatus)="onUpdateStatus(ticket.id, $event)"
        (deleteTicket)="onDeleteTicket($event)">
      </app-ticket>
    </div>
  </div>

  <div class="add-ticket-section">
    <button 
      *ngIf="!showAddTicket" 
      class="add-ticket-btn" 
      (click)="showAddTicket = true">
      + Add a ticket
    </button>

    <div *ngIf="showAddTicket" class="add-ticket-form">
      <textarea
        class="ticket-input"
        [(ngModel)]="newTicketContent"
        placeholder="Enter ticket content..."
        rows="3"
        (keydown.enter)="$event.ctrlKey && onAddTicket()">
      </textarea>
      <div class="form-actions">
        <button class="btn-primary" (click)="onAddTicket()">Add</button>
        <button class="btn-cancel" (click)="showAddTicket = false; newTicketContent = ''">Cancel</button>
      </div>
    </div>
  </div>
</div>
