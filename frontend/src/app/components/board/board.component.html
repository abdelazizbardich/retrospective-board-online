<div class="board-container" *ngIf="board">
  <header class="board-header">
    <h1 class="board-title">{{ board.name }}</h1>
    <div class="header-info">
      <div class="user-info">
        <span>User: {{ username }}</span>
        <span *ngIf="isUserAdmin()" class="admin-badge">Admin</span>
      </div>
      <div class="retro-controls" *ngIf="isUserAdmin()">
        <span class="retro-status">Status: {{ getRetroStateDisplay() }}</span>
        <button 
          *ngIf="canStartRetro()" 
          class="retro-btn start-btn" 
          (click)="onStartRetro()">
          Start Retro
        </button>
        <button 
          *ngIf="canStopRetro()" 
          class="retro-btn stop-btn" 
          (click)="onStopRetro()">
          Stop Retro
        </button>
        <button 
          class="retro-btn toggle-btn" 
          (click)="onToggleUserNames()"
          [title]="board?.showUserNames ? 'Click to hide usernames' : 'Click to show usernames'">
          {{ getUserNamesButtonText() }}
        </button>
      </div>
    </div>
  </header>

  <div class="columns-container">
    <app-column
      *ngFor="let column of board.columns"
      [column]="column"
      [boardId]="board.id"
      [userId]="userId"
      [isAdmin]="isUserAdmin()"
      [showUserNames]="board.showUserNames"
      (addTicket)="onAddTicket($event)"
      (voteTicket)="onVoteTicket($event)"
      (unvoteTicket)="onUnvoteTicket($event)"
      (updateTicketStatus)="onUpdateTicketStatus($event)"
      (deleteTicket)="onDeleteTicket($event)"
      (moveTicket)="onMoveTicket($event)"
      (deleteColumn)="onDeleteColumn($event)">
    </app-column>

    <div class="add-column-container">
      <button 
        *ngIf="!showAddColumn" 
        class="add-column-btn" 
        (click)="showAddColumn = true">
        + Add another column
      </button>

      <div *ngIf="showAddColumn" class="add-column-form">
        <input
          type="text"
          class="column-input"
          [(ngModel)]="newColumnName"
          placeholder="Enter column name..."
          (keydown.enter)="onAddColumn()"
          autofocus>
        <div class="form-actions">
          <button class="btn-primary" (click)="onAddColumn()">Add</button>
          <button class="btn-cancel" (click)="showAddColumn = false; newColumnName = ''">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="loading-container" *ngIf="!board">
  <p>Loading board...</p>
</div>
