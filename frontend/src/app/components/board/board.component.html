<div class="board-container" *ngIf="board">
  <header class="board-header">
    <h1 class="board-title">{{ board.name }}</h1>
    <div class="user-info">User: {{ userId }}</div>
  </header>

  <div class="columns-container">
    <app-column
      *ngFor="let column of board.columns"
      [column]="column"
      [boardId]="board.id"
      [userId]="userId"
      (addTicket)="onAddTicket($event)"
      (voteTicket)="onVoteTicket($event)"
      (unvoteTicket)="onUnvoteTicket($event)"
      (updateTicketStatus)="onUpdateTicketStatus($event)"
      (deleteTicket)="onDeleteTicket($event)"
      (moveTicket)="onMoveTicket($event)"
      (deleteColumn)="onDeleteColumn($event)">
    </app-column>

    <div class="add-column-container">
      <button 
        *ngIf="!showAddColumn" 
        class="add-column-btn" 
        (click)="showAddColumn = true">
        + Add another column
      </button>

      <div *ngIf="showAddColumn" class="add-column-form">
        <input
          type="text"
          class="column-input"
          [(ngModel)]="newColumnName"
          placeholder="Enter column name..."
          (keydown.enter)="onAddColumn()"
          autofocus>
        <div class="form-actions">
          <button class="btn-primary" (click)="onAddColumn()">Add</button>
          <button class="btn-cancel" (click)="showAddColumn = false; newColumnName = ''">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="loading-container" *ngIf="!board">
  <p>Loading board...</p>
</div>
